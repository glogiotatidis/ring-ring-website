<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Η σελίδα δεν βρέθηκε · Ring Ring</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FDF8E5">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<style>
  :root { --cream: #FDF8E5; --orange: #EE4421; --blue: #2D72A9; --ink: #211D18; --ink-soft: #4A423A; --radius: 999px; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: clamp(1.5rem, 6vw, 4rem) clamp(1rem, 5vw, 2rem);
    background: var(--cream);
    color: var(--ink);
    font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Segoe UI Variable Display",
                 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .logo-frame { width: min(60vw, 14rem); aspect-ratio: 1254 / 820; overflow: hidden; }
  .logo-frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
  h1 { margin: 0; font-size: clamp(1.4rem, 5.5vw, 2rem); font-weight: 800; letter-spacing: -0.02em; }
  p { margin: 0; max-width: 40ch; color: var(--ink-soft); }
  a.home {
    display: inline-block;
    padding: .72em 1.5em;
    border-radius: var(--radius);
    background: var(--blue);
    color: #FFFFFF;
    font-size: 1.15rem;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 8px 18px rgba(45, 114, 169, .26);
    transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  a.home:hover, a.home:focus-visible {
    background: var(--orange);
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(238, 68, 33, .28);
  }
  a.home:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    a.home { transition: none; }
  }
</style>
</head>
<body>
  <div class="logo-frame">
    <img src="assets/ring-ring-logo.jpg" alt="Ring Ring logo" width="1254" height="1254" decoding="async">
  </div>
  <h1>Κανένα τηλέφωνο δεν χτυπάει εδώ.</h1>
  <p>Αυτή η σελίδα δεν υπάρχει. Κανένα κακό.</p>
  <a class="home" href="./">Πίσω στην αρχική</a>
</body>
</html>
